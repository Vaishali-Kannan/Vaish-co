services:
  # ─── 1. React Web Storefront (Static Site) ─────────────────────────
  - type: web
    name: vaish-co-web
    runtime: static
    buildCommand: npm install && cd apps/web && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vaish-co-api.onrender.com/api

  # ─── 2. Express Backend API (Web Service) ──────────────────────────
  - type: web
    name: vaish-co-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
